[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rockhound"
version = "0.1.0"
description = "Terrain representation and path planning for planetary rover navigation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
include = ["rockhound*"]
